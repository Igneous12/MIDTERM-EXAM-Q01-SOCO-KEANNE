<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Request List</title>
</head>

<body>

    <h1>Request</h1>

    <button onclick="loadRequests()">Load Request</button>

    <br><br>

    <input type="number" id="requestId" placeholder="Enter request ID">
    <button onclick="searchRequest()">Search ID</button>

    <ul id="requestList"></ul>

    <script>
        async function loadRequests() {

            const response = await fetch("api/requests");
            const requests = await response.json();
            const list = document.getElementById("requestList");

            list.innerHTML = "";

            requests.forEach(request => {
                const item = document.createElement("li");

                item.textContent =
                    request.id + " - " + request.requester + " - " + request.location + " - " + request.problem + " - " + request.priority + " - " + request.status;

                list.appendChild(item);
            });
        }

        async function searchRequest() {

            const id = document.getElementById("requestId").value;
            const list = document.getElementById("requestList");

            const response = await fetch("api/requests/" + id);
            const request = await response.json();

            list.innerHTML = "";

            const item = document.createElement("li");

            if (response.ok) {
                item.textContent =
                    request.id + " - " + request.requester + " - " + request.location + " - " + request.problem + " - " + request.priority + " - " + request.status;
            } else {
                item.textContent = request.message;
            }

            list.appendChild(item);
        }
    </script>

</body>
</html>
